name: Probe seohost SSH port

on:
  pull_request:
    paths:
      - ".github/workflows/probe-seohost.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check that GitHub can reach the SSH server of h69.seohost.pl
        run: |
          ssh-keyscan -T 15 -p 57185 h69.seohost.pl > host_keys.txt
          cat host_keys.txt | cut -c1-80
          ssh-keygen -lf host_keys.txt
